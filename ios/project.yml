name: Zkouska
options:
  bundleIdPrefix: cz.zsiska
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Zkouska:
    type: application
    platform: iOS
    sources: [Zkouska]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.zsiska.zkouska
        PRODUCT_NAME: Zkouska
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Zkouska/Info.plist
      properties:
        CFBundleDisplayName: Zkouška
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
