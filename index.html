<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zkouška</title>
  <meta name="description" content="Zkušební aplikace: počítadlo a poznámka">
  <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zkouška">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg: #f3f5f8; --card: #ffffff; --text: #111827; --muted: #6b7280;
      --line: #e3e7ee; --accent: #1766d6; --danger: #d92d20;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0f17; --card: #161c28; --text: #f1f4f9; --muted: #98a2b3;
              --line: #263042; --accent: #5b9dff; --danger: #ff6b5e; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 16px)
               calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px);
    }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 34px; margin: 0 0 20px; letter-spacing: -0.02em; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
         color: var(--muted); margin: 0 0 8px 4px; }
    section { margin-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    #count { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    button { font: inherit; border: 0; cursor: pointer; }
    #plus {
      width: 72px; height: 72px; border-radius: 50%; flex: none;
      background: var(--accent); color: #fff; font-size: 40px; line-height: 1;
      display: grid; place-items: center; transition: transform .08s;
    }
    #plus:active { transform: scale(.93); }
    #reset {
      margin-top: 14px; padding: 12px 0 0; width: 100%; text-align: left;
      background: none; color: var(--danger); border-top: 1px solid var(--line);
    }
    #reset:disabled { color: var(--muted); opacity: .6; }
    textarea {
      display: block; width: 100%; min-height: 120px; resize: vertical;
      font: inherit; color: inherit; background: transparent; border: 0; outline: 0; padding: 0;
    }
    textarea::placeholder { color: var(--muted); }

    .lights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px 4px 22px;
              background: #05070c; border-radius: 12px; }
    .light { --lv: 0; aspect-ratio: 1; border-radius: 50%; background: var(--c);
             opacity: calc(.12 + .88 * var(--lv));
             transform: scale(calc(.82 + .18 * var(--lv)));
             box-shadow: 0 0 calc(6px + 38px * var(--lv)) calc(10px * var(--lv)) var(--c); }
    .lights.full { position: fixed; inset: 0; z-index: 10; border-radius: 0; gap: 0; padding: 0;
                   grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); }
    .lights.full .light { aspect-ratio: auto; border-radius: 0; transform: none; box-shadow: none;
                          opacity: calc(.04 + .96 * var(--lv)); }
    .legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px;
              font-size: 12px; color: var(--muted); text-align: center; }
    #mic { margin-top: 14px; width: 100%; padding: 14px; border-radius: 12px;
           background: var(--accent); color: #fff; font-weight: 600; }
    #mic.on { background: var(--danger); }
    #micmsg { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
    #micmsg:empty { display: none; }
    .foot { color: var(--muted); font-size: 13px; padding: 0 4px; }
    .foot p { margin: 0 0 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Zkouška</h1>

    <section>
      <h2>Počítadlo</h2>
      <div class="card">
        <div class="row">
          <output id="count" aria-live="polite">0</output>
          <button id="plus" type="button" aria-label="Přičíst">+</button>
        </div>
        <button id="reset" type="button" disabled>Vynulovat</button>
      </div>
    </section>

    <section>
      <h2><label for="note">Poznámka</label></h2>
      <div class="card">
        <textarea id="note" placeholder="Napište cokoli…"></textarea>
      </div>
    </section>

    <section>
      <h2>Barevná hudba</h2>
      <div class="card">
        <div class="lights" id="lights" role="img" aria-label="Světla reagující na zvuk">
          <div class="light" style="--c:#ff2d2d"></div>
          <div class="light" style="--c:#ffc400"></div>
          <div class="light" style="--c:#1fd655"></div>
          <div class="light" style="--c:#2f7bff"></div>
        </div>
        <div class="legend"><span>basy</span><span>nižší středy</span><span>vyšší středy</span><span>výšky</span></div>
        <button id="mic" type="button">Zapnout mikrofon</button>
        <p id="micmsg" role="status"></p>
      </div>
    </section>

    <div class="foot">
      <p>Počítadlo i poznámka zůstanou uložené v tomto telefonu i po zavření aplikace.</p>
      <p>Zvuk z mikrofonu se nikam neodesílá ani neukládá.</p>
      <p>Verze 1.1 (web)</p>
    </div>
  </main>

  <script>
    const store = {
      get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    };
    const countEl = document.getElementById("count");
    const resetEl = document.getElementById("reset");
    const noteEl = document.getElementById("note");
    let count = parseInt(store.get("zkouska.pocet", "0"), 10) || 0;

    function show() {
      countEl.textContent = count;
      resetEl.disabled = count === 0;
    }
    document.getElementById("plus").addEventListener("click", () => {
      count += 1; store.set("zkouska.pocet", String(count)); show();
    });
    resetEl.addEventListener("click", () => {
      count = 0; store.set("zkouska.pocet", "0"); show();
    });
    noteEl.value = store.get("zkouska.poznamka", "");
    noteEl.addEventListener("input", () => store.set("zkouska.poznamka", noteEl.value));
    show();

    // ── Barevná hudba: čtyři světla podle hlasitosti v kmitočtových pásmech ──
    const BANDS = [[40, 250], [250, 1000], [1000, 4000], [4000, 12000]]; // Hz
    const lightsEl = document.getElementById("lights");
    const lightEls = [...lightsEl.children];
    const micBtn = document.getElementById("mic");
    const micMsg = document.getElementById("micmsg");
    let audio = null; // { ctx, stream, analyser, data, raf, lock }

    async function micStart() {
      micMsg.textContent = "";
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        micMsg.textContent = "Tento prohlížeč přístup k mikrofonu nepodporuje.";
        return;
      }
      micBtn.disabled = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
        await ctx.resume();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.55;
        ctx.createMediaStreamSource(stream).connect(analyser);
        audio = {
          ctx, stream, analyser,
          data: new Uint8Array(analyser.frequencyBinCount),
          peak: BANDS.map(() => 0.25), level: BANDS.map(() => 0), raf: 0, lock: null,
        };
        try { audio.lock = await navigator.wakeLock.request("screen"); } catch (e) {}
        micBtn.textContent = "Vypnout mikrofon";
        micBtn.classList.add("on");
        micMsg.textContent = "Klepnutím na světla je roztáhnete přes celou obrazovku.";
        audio.raf = requestAnimationFrame(micFrame);
      } catch (e) {
        micMsg.textContent = e && e.name === "NotAllowedError"
          ? "Přístup k mikrofonu byl zamítnut. Povolte ho v Nastavení → Safari → Mikrofon a zkuste to znovu."
          : "Mikrofon se nepodařilo zapnout" + (e && e.message ? ": " + e.message : ".");
      } finally {
        micBtn.disabled = false;
      }
    }

    function micFrame() {
      if (!audio) return;
      const a = audio;
      a.analyser.getByteFrequencyData(a.data);
      const hzPerBin = a.ctx.sampleRate / a.analyser.fftSize;
      BANDS.forEach(([lo, hi], i) => {
        const from = Math.max(1, Math.floor(lo / hzPerBin));
        const to = Math.min(a.data.length - 1, Math.ceil(hi / hzPerBin));
        let sum = 0;
        for (let b = from; b <= to; b++) sum += a.data[b];
        const raw = sum / (to - from + 1) / 255;
        // Citlivost se sama přizpůsobuje: špička pásma pomalu klesá.
        a.peak[i] = Math.max(raw, a.peak[i] * 0.995, 0.12);
        const target = Math.pow(Math.min(1, raw / a.peak[i]), 2);
        // Rychlý náběh, pomalejší dosvit.
        a.level[i] = target > a.level[i] ? target : a.level[i] * 0.86 + target * 0.14;
        lightEls[i].style.setProperty("--lv", a.level[i].toFixed(3));
      });
      a.raf = requestAnimationFrame(micFrame);
    }

    function micStop() {
      if (!audio) return;
      cancelAnimationFrame(audio.raf);
      audio.stream.getTracks().forEach((t) => t.stop());
      audio.ctx.close().catch(() => {});
      if (audio.lock) audio.lock.release().catch(() => {});
      audio = null;
      lightEls.forEach((el) => el.style.setProperty("--lv", "0"));
      lightsEl.classList.remove("full");
      micBtn.textContent = "Zapnout mikrofon";
      micBtn.classList.remove("on");
      micMsg.textContent = "";
    }

    micBtn.addEventListener("click", () => (audio ? micStop() : micStart()));
    lightsEl.addEventListener("click", () => { if (audio) lightsEl.classList.toggle("full"); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) micStop(); });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
